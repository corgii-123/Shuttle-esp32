# 搞快 Shuttle server configuration. Copy to config.yaml (git-ignored) and edit.
# deploy/install.sh does this for you and generates a random token.
# Every key is optional; defaults are shown. Env overrides: SHUTTLE_TOKEN, SHUTTLE_PORT,
# SHUTTLE_LOG_DIR, SHUTTLE_ASR, SHUTTLE_AGENT, SHUTTLE_TTS, SHUTTLE_ADB.

server:
  host: 127.0.0.1          # cloudflared connects locally. 0.0.0.0 only for LAN tests.
  port: 8780
  public_url: wss://shuttle.example.com   # your Cloudflare Tunnel hostname (OTA links, docs)
  remote_api: false        # /status and /api/* (phone control) only for programs on this Mac;
                           # true also serves them to the LAN / through the tunnel (token still needed)
  ctrl_heartbeat_s: 30     # WebSocket ping on /ws/ctrl (0 = off)
  adb_heartbeat_s: 20      # WebSocket ping on /ws/adb (0 = off)

auth:
  token: change-me         # MUST equal CONFIG_SHUTTLE_TOKEN in the firmware
  allow_query_token: false # accept ?token=... too (curl/browser convenience)

logging:
  dir: ~/Library/Logs/shuttle   # shuttle.log, rotated by size
  level: INFO
  max_bytes: 10485760
  backup_count: 10
  console: true            # install.sh sets false under launchd (avoid unrotated stdout)

adb:
  path: adb                # or /opt/homebrew/bin/adb ; may be a command line
  bind_host: 127.0.0.1
  local_port: 15555        # adb connect 127.0.0.1:15555 (2nd device: 15556, ...)
  connect_interval_s: 5
  device_grace_s: 60       # keep the tunnel this long after the ESP32 disconnects
  pair_wait_s: 10
  phone_ready_timeout_s: 3
  command_timeout_s: 30
  offline_reset_s: 30
  fallback_serial: ""      # e.g. "R58M123ABC" (USB) to test the agent without the ESP32

phone:
  screenshot_short_side: 720
  screenshot_max_bytes: 204800   # 200 KB
  jpeg_quality: 80
  jpeg_min_quality: 35
  device_side_screenshot: false  # true: compress on the phone with phone_helper (fallback: Mac)
  helper_jar: ""                 # default: shuttle_server/phone_helper/shuttle-helper.jar
  input_method: auto             # auto | clipboard | adbkeyboard | input_text
  ui_dump_timeout_s: 20

# Several phones: the board finds every phone with `adb tcpip 5555` on its Wi-Fi, the Mac
# recognises them (serial/model) and picks one. Switch by voice: "换手机", "切换到<名字>",
# "现在连的是哪台手机"; or GET/POST /api/phones.
phones:
  state_file: "~/Library/Application Support/shuttle/phones.json"   # known phones; "" = memory only
  auto_switch_new: true    # a never-seen phone appears (just ran adb tcpip) -> switch to it when idle
  voice_commands: true
  aliases: {}              # serial -> spoken name, e.g. {"R5CT1234ABC": "工作机", "3A121FDJG": "小米"}
  rescan_wait_s: 8
  avoid_after_fail_s: 120

voice:
  uplink_sample_rate: 16000
  tts_sample_rate: 24000   # board codec runs at 24 kHz -> no resampling on the ESP32
  frame_duration_ms: 60
  tts_lead_frames: 5
  tts_start_delay_s: 0.8   # audio starts this long after "tts start": the device drops audio that
                           # arrives while it is still switching to "speaking" (e-paper refresh)
  min_utterance_ms: 400    # shorter presses are ignored (accidental taps)
  max_utterance_s: 60
  keepalive_s: 30          # keeps xiaozhi's 120 s channel timeout from firing
  idle_close_s: 600        # close idle voice channel (saves ESP32 battery); 0 = never
  cancel_on_new_utterance: true
  save_utterances_dir: ""  # debug: keep every utterance as WAV (e.g. ~/Library/Logs/shuttle/utterances)
  max_spoken_chars: 60     # longer replies are cut at a sentence end before TTS (screen shows all); 0 = off
  vad_silence_ms: 800      # only for stock xiaozhi devices in "auto" listen mode
  vad_threshold: 500

asr:
  provider: qwen           # qwen | mock
  qwen:
    base_url: http://127.0.0.1:8765/v1   # mlx-audio server (`mlx_audio.server --port 8765`) or vLLM
    api: transcriptions    # transcriptions (/audio/transcriptions) | chat (/chat/completions + audio_url)
    model: mlx-community/Qwen3-ASR-1.7B-8bit
    api_key: EMPTY
    language: zh
    prompt: ""
    timeout_s: 60
  mock:
    text: 打开设置

agent:
  provider: llm            # llm (vision LLM drives the phone) | simple (rule-based demo) | echo | command | python
  max_steps: 15
  step_delay_s: 0.8
  timeout_s: 300
  llm:                     # any OpenAI-compatible /chat/completions with tool calling
    base_url: http://127.0.0.1:8000/v1   # e.g. Splash serving Qwen3.8-27B (vision). Text-only models work
    model: ""              # too (UI tree instead of screenshots), but much worse. "" = first of GET /models
    api_key: EMPTY
    vision: auto           # auto: trust GET /models ("vision"/"input_modalities") | true | false
    ui_tree: auto          # also send the uiautomator element list: auto (= only without vision) | true | false
    coords: norm1000       # Qwen-VL answers on a 0..1000 grid; "pixel" for models that use screenshot pixels
    temperature: 0
    max_tokens: 512
    timeout_s: 120
    history_images: 1      # screenshots kept in the conversation (older ones -> text)
    memory_turns: 3        # previous instructions/replies of this device given as context
    reasoning_effort: ""   # e.g. low, if the server supports it (slower, sometimes better)
    fast_launch: true      # a bare "打开<应用>" launches the app directly (no LLM round trip, ~3 s total)
    extra_prompt: ""       # appended to the system prompt (house rules, app hints ...)
  command:                 # your pi agent as a process; it uses $SHUTTLE_PHONE_API
    argv: ["pi", "-p", "{instruction}"]
    cwd: ""
  python:                  # or your agent as a Python class implementing pipeline.agent.Agent
    target: ""             # "my_pi_agent:PiAgent"
    options: {}

tts:
  pitch_semitones: 0       # +3..+5 = child-like voice (ffmpeg pitch shift of any provider)
  provider: say            # say (macOS) | mock (beeps) | openai | command
  say:
    voice: Tingting
    rate: 200
  openai:
    base_url: http://127.0.0.1:8001/v1
    model: tts-1
    voice: alloy
    api_key: EMPTY
    timeout_s: 60
  command:
    argv: ["my-tts", "--text", "{text}", "--out", "{out}"]

ota:
  enabled: true            # answers the firmware's boot-time /xiaozhi/ota/ check
  timezone_offset_min: 480
  firmware_dir: ""         # put "<x.y.z>.bin" files here to push firmware over the air. Served without
                           # a token, and a build contains your token + Wi-Fi passwords: keep it empty
                           # unless the images are built without private settings.
  expose_websocket_url: false

phone_api:
  enabled: true            # /api/phone/* (token) for external agents
