[project]
name = "shuttle-server"
version = "0.1.0"
description = "搞快 Shuttle: Mac-side server (xiaozhi-compatible voice channel, ADB tunnel, ASR -> Agent -> TTS)"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "PyYAML>=6.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
sim = ["sounddevice>=0.4"]

[project.scripts]
shuttle-server = "shuttle_server.__main__:main"

[tool.setuptools.packages.find]
include = ["shuttle_server*"]

[tool.setuptools.package-data]
shuttle_server = ["phone_helper/*.jar"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
