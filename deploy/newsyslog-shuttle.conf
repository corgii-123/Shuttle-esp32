# Rotate the launchd stdout/stderr files (the app's shuttle.log rotates itself).
# Installed by install.sh to /etc/newsyslog.d/shuttle.conf
# logfilename                                   [owner:group] mode count size(KB) when flags
@@LOG_DIR@@/launchd.out.log                    @@USER@@:staff 644  5     5120     *    NJ
@@LOG_DIR@@/launchd.err.log                    @@USER@@:staff 644  5     5120     *    NJ
@@LOG_DIR@@/watchdog.log                       @@USER@@:staff 644  3     1024     *    NJ
